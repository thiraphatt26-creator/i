<!DOCTYPE html>

<body>

<div class="topbar"><div class="wrap">
  <span id="announce"></span>
  <span class="tb-r" id="tbContact"></span>

<header class="head"><div class="wrap head-in">

  <form class="search" id="searchForm" autocomplete="off">
    <select id="sCat" aria-label="Category"></select>
    <input id="q" placeholder="Search by part name, machine brand or SKU" aria-label="Search products">
    <button aria-label="Search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span></button>
    <div class="suggest" id="suggest"></div>

  <div class="actions">

  </div>
</div>
<nav class="cnav"><div class="wrap" id="cnav"></div></nav>
</header>

<main id="app"><div class="boot"><div class="spin"></div><p>Connecting to the store…</p></div></main>

<footer id="footer"><div class="wrap">
  <div class="fcols">
    <div><b class="flogo"><svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="#0f1b2d"/><path d="M19 8h10v15.2L19 29.5z" fill="#fff"/><path d="M19 33.3l10-6.3V40H19z" fill="#e8541e"/></svg><span id="fName">Injanda Trading & Consult</span></b><p id="fTag"></p><p class="fct" id="fContact"></p></div>
    <div><b>Products</b><div id="fCats"></div></div>
    <div><b>Company</b><a href="#/shop">All products</a><a href="#/account">My account</a><a href="#/quote">Request a quote</a></div>
    <div><b>Quality</b><p>DIN ISO 9001 certified manufacturing. Free estimates, 6-month warranty on repairs.</p></div>
  </div>
  <p class="copy">© 2026 Injanda Trading & Consult. All rights reserved.<span id="adminDot">·</span></p>
</div></footer>

  <div class="drawer-b" id="cartList"></div>
  <div class="drawer-f" id="cartFoot"></div>
</aside>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toasts" id="toasts"></div>

<div class="admin" id="admin" hidden></div>
<div class="adlg" id="adlg"><div class="adlg-box" id="adlgBox"></div></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>

</html>
